[package]
name = "vagrant-studio"
description = "Visual Vagrant management desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "vagrant-studio"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "vagrant_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vagrant-studio-config-model.workspace = true
vagrant-studio-domain.workspace = true
vagrant-studio-git.workspace = true
vagrant-studio-operation-engine.workspace = true
vagrant-studio-platform.workspace = true
vagrant-studio-project-service.workspace = true
vagrant-studio-project-store.workspace = true
vagrant-studio-provider-registry.workspace = true
vagrant-studio-vagrant-adapter.workspace = true

[lints]
workspace = true
