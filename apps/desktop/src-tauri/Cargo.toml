[package]
name = "vagrant-studio"
description = "Visual Vagrant management desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "vagrant-studio"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "vagrant_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vagrant-studio-platform.workspace = true

[lints]
workspace = true
