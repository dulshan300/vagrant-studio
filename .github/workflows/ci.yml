name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Each platform independently runs frontend checks, Rust checks, native compilation and
  # packaging (docs/decisions/0004). Tests that need a real VM are #[ignore]d / opt-in and
  # do not run here.
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 11 x64
            os: windows-latest
            bundles: nsis
          - name: Ubuntu 24.04 x64
            os: ubuntu-24.04
            bundles: deb,appimage
          - name: Fedora x64 (container)
            os: ubuntu-24.04
            # Current Fedora release; bump when it reaches end of life.
            container: fedora:44
            bundles: rpm
    steps:
      - name: Install system packages (Fedora)
        if: matrix.container
        run: |
          dnf -y install git tar xz gzip which file gcc gcc-c++ make curl wget \
            webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel librsvg2-devel libxdo-devel

      - name: Install system packages (Ubuntu)
        if: runner.os == 'Linux' && !matrix.container
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential file patchelf

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint, format, typecheck, tests
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build and package
        run: pnpm --filter @vagrant-studio/desktop tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: vagrant-studio-${{ runner.os }}-${{ matrix.bundles }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error
