[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/OWNER/vagrant-studio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "io-util", "sync", "time", "net"] }
uuid = { version = "1", features = ["v7", "serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros", "time", "uuid"] }
trash = "5"
regex = "1"
tokio-util = "0.7"
dunce = "1"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "job-object", "creation-flags", "process-group", "kill-on-drop"] }

vagrant-studio-domain = { path = "crates/domain" }
vagrant-studio-operation-engine = { path = "crates/operation-engine" }
vagrant-studio-platform = { path = "crates/platform" }
vagrant-studio-project-service = { path = "crates/project-service" }
vagrant-studio-project-store = { path = "crates/project-store" }
vagrant-studio-vagrant-adapter = { path = "crates/vagrant-adapter" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
